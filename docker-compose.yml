services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: restaurante
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD}
      APP_DB_PASSWORD: ${DB_APP_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d restaurante"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://app:${DB_APP_PASSWORD}@db:5432/restaurante
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMINIO: ${DOMINIO:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:5600:8080"
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

  respaldos:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${DB_ADMIN_PASSWORD}
    volumes:
      - ./respaldos:/respaldos
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c 'while true; do
      pg_dump -h db -U admin restaurante | gzip > /respaldos/restaurante_$$(date +%F).sql.gz;
      find /respaldos -name "*.sql.gz" -mtime +14 -delete;
      sleep 86400; done'

  # Fase 2: análisis con IA local. Activar con: docker compose --profile ia up -d
  ollama:
    image: ollama/ollama
    profiles: ["ia"]
    volumes:
      - ollama:/root/.ollama

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  ollama:
